.design-ui-credit {
  position: fixed;
  bottom: 12px;
  right: 12px;
  font: 11px/1 system-ui, sans-serif;

  user-select: none;

  .design-ui-credit { display: none; }

<script>
(function () {
    // Design-ui pages are single compositions, so the whole body is editable.
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    // Credit badge with idle-fade. Hover devices only.
    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

</script>

ze:0.8125rem">RPASmartBot</span></div><div class="page active" id="page-active"></div><div class="page" id="page-resolved"></div><div class="page" id="page-create"></div><div class="page" id="page-detail"></div><div class="page" id="page-rpa"></div><div class="page" id="page-logs"></div><div class="page" id="page-users"></div><div class="page" id="page-settings"></div></div></div>

// === GMAIL SEND (with image support) ===
async function sendGmailEmail(to,subject,htmlBody,imageBase64){if(!gmailToken)return false;try{let raw;if(imageBase64&&imageBase64.startsWith('data:')){const boundary='b_'+Date.now();const imageType=imageBase64.split(';')[0].split(':')[1];const imageData=imageBase64.split(',')[1];const htmlFinal=htmlBody.replace('{{IMAGE_CID}}','<img src="cid:incident-image" style="width:100%;border-radius:8px;margin-top:16px">');let mime=`From:me\r\nTo:${to}\r\nSubject:=?UTF-8?B?${btoa(unescape(encodeURIComponent(subject)))}?=\r\nMIME-Version:1.0\r\nContent-Type:multipart/related; boundary="${boundary}"\r\n\r\n--${boundary}\r\nContent-Type:text/html;charset=UTF-8\r\nContent-Transfer-Encoding:base64\r\n\r\n${btoa(unescape(encodeURIComponent(htmlFinal)))}\r\n--${boundary}\r\nContent-Type:${imageType}\r\nContent-Transfer-Encoding:base64\r\nContent-ID:<incident-image>\r\nContent-Disposition:inline;filename="evidencia.png"\r\n\r\n${imageData}\r\n--${boundary}--`;raw=btoa(unescape(encodeURIComponent(mime))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}else{const htmlFinal=htmlBody.replace('{{IMAGE_CID}}','');const mime=`From:me\r\nTo:${to}\r\nSubject:=?UTF-8?B?${btoa(unescape(encodeURIComponent(subject)))}?=\r\nMIME-Version:1.0\r\nContent-Type:text/html;charset=UTF-8\r\nContent-Transfer-Encoding:base64\r\n\r\n${btoa(unescape(encodeURIComponent(htmlFinal)))}`;raw=btoa(unescape(encodeURIComponent(mime))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}await gapi.client.gmail.users.messages.send({userId:'me',resource:{raw}});return true;}catch(e){console.error(e);return false;}}

function buildIncidentEmailHtml(inc){const res=new Date(inc.resolution_time).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});return `<!DOCTYPE html><html><body style="margin:0;padding:0;font-family:-apple-system,sans-serif;background:#f4f4f5"><table width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px"><tr><td align="center"><table width="580" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06)"><tr><td style="background:#dc2626;padding:28px 32px"><div style="color:rgba(255,255,255,0.75);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px">⚠ Incidente de Impacto${inc.protocol?' | '+esc(inc.protocol):''}</div><div style="color:#fff;font-size:22px;font-weight:700;margin-top:8px;line-height:1.3">${esc(inc.title)}</div></td></tr><tr><td style="padding:32px"><table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:24px"><tr><td width="48%" style="padding:14px 18px;background:#fef2f2;border-radius:10px;vertical-align:top"><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#991b1b;margin-bottom:4px">Rotina Impactada</div><div style="font-size:15px;font-weight:600;color:#1a1a1a">${esc(inc.routine)}</div></td><td width="4%"></td><td width="48%" style="padding:14px 18px;background:#eff6ff;border-radius:10px;vertical-align:top"><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#1e40af;margin-bottom:4px">Responsável</div><div style="font-size:15px;font-weight:600;color:#1a1a1a">${esc(inc.responsible)}</div></td></tr></table><table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:24px"><tr><td style="padding:14px 18px;background:#fffbeb;border-radius:10px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#92400e;margin-bottom:4px">Previsão de Resolução</div><div style="font-size:15px;font-weight:600;color:#1a1a1a">${res}</div></td></tr></table><div style="border-top:1px solid #e5e5e5;padding-top:20px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#737373;margin-bottom:8px">Descrição</div><div style="font-size:14px;line-height:1.7;color:#404040">${esc(inc.description).replace(/\n/g,'<br>')}</div></div>{{IMAGE_CID}}</td></tr><tr><td style="background:#fafafa;padding:16px 32px;border-top:1px solid #e5e5e5;text-align:center;font-size:11px;color:#a3a3a3">RPASmartBot | Comunicado automático</td></tr></table></td></tr></table></body></html>`;}
function buildResolvedEmailHtml(inc){const rd=new Date(inc.resolved_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});return `<!DOCTYPE html><html><body style="margin:0;padding:0;font-family:-apple-system,sans-serif;background:#f4f4f5"><table width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px"><tr><td align="center"><table width="580" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06)"><tr><td style="background:#16a34a;padding:28px 32px"><div style="color:rgba(255,255,255,0.75);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px">✓ Incidente Resolvido${inc.protocol?' | '+esc(inc.protocol):''}</div><div style="color:#fff;font-size:22px;font-weight:700;margin-top:8px;line-height:1.3">${esc(inc.title)}</div></td></tr><tr><td style="padding:32px"><table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:24px"><tr><td style="padding:20px;background:#f0fdf4;border-radius:10px;text-align:center"><div style="font-size:22px;font-weight:800;color:#16a34a">RESOLVIDO</div><div style="font-size:13px;color:#166534;margin-top:6px">${rd}${inc.resolved_by?' | por '+esc(inc.resolved_by):''}</div></td></tr></table><table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:24px"><tr><td width="48%" style="padding:14px 18px;background:#f9fafb;border-radius:10px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:4px">Rotina</div><div style="font-size:15px;font-weight:600">${esc(inc.routine)}</div></td><td width="4%"></td><td width="48%" style="padding:14px 18px;background:#f9fafb;border-radius:10px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#6b7280;margin-bottom:4px">Responsável</div><div style="font-size:15px;font-weight:600">${esc(inc.responsible)}</div></td></tr></table><div style="border-top:1px solid #e5e5e5;padding-top:20px;font-size:14px;line-height:1.7;color:#404040">${esc(inc.description).replace(/\n/g,'<br>')}</div></td></tr><tr><td style="background:#fafafa;padding:16px 32px;border-top:1px solid #e5e5e5;text-align:center;font-size:11px;color:#a3a3a3">RPASmartBot | Comunicado automático</td></tr></table></td></tr></table></body></html>`;}

// === STATE & AUTH ===
let currentUser=null,formEmails=[],formImage=null,lastDetailFrom='active';
let rpaToken=null,rpaTeams=[],rpaMotives=[],rpaStatuses=[],rpaAssignments=[],rpaSelected=new Set(),rpaClients=[],rpaSelectedClients=new Set(),rpaAssignmentsData=[],rpaForwardContext={assignmentId:'',loading:false,lastSelectionKey:''};
async function hashPw(p){const e=new TextEncoder(),d=e.encode(p+'rbot_salt'),h=await crypto.subtle.digest('SHA-256',d);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');}
function cleanCPF(c){return c.replace(/\D/g,'');}
function maskCPF(i){let v=i.value.replace(/\D/g,'').slice(0,11);if(v.length>9)v=v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4');else if(v.length>6)v=v.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');else if(v.length>3)v=v.replace(/(\d{3})(\d{1,3})/,'$1.$2');i.value=v;}
function validateCPF(c){c=cleanCPF(c);if(c.length!==11||/^(\d)\1+$/.test(c))return false;let s=0;for(let i=0;i<9;i++)s+=parseInt(c[i])*(10-i);let d=(s*10)%11;if(d===10)d=0;if(d!==parseInt(c[9]))return false;s=0;for(let i=0;i<10;i++)s+=parseInt(c[i])*(11-i);let d2=(s*10)%11;if(d2===10)d2=0;return d2===parseInt(c[10]);}
function isSA(){return currentUser?.role==='superadmin';}
function genId(p=''){return p+Date.now()+'_'+Math.random().toString(36).substr(2,6);}
async function addLog(type,details){await sb.from('logs').insert({id:genId('l'),type,user_name:currentUser?.name||'Sistema',details});}
function switchTab(t){document.querySelectorAll('.login-tab').forEach(x=>x.classList.remove('active'));event.target.classList.add('active');document.getElementById('loginForm').style.display=t==='login'?'':'none';document.getElementById('registerForm').style.display=t==='register'?'':'none';hideMsg();}
function showErr(m){document.getElementById('loginErr').textContent=m;document.getElementById('loginErr').classList.add('show');}
function showInfo(m){document.getElementById('loginInfo').textContent=m;document.getElementById('loginInfo').classList.add('show');}
function hideMsg(){document.getElementById('loginErr').classList.remove('show');document.getElementById('loginInfo').classList.remove('show');}
async function doLogin(){hideMsg();const id=document.getElementById('login-id').value.trim(),pw=document.getElementById('login-pass').value;if(!id||!pw){showErr('Preencha tudo.');return;}const hash=await hashPw(pw);const{data,error}=await sb.from('users').select('*').or(`email.eq.${id},cpf.eq.${id}`).eq('password_hash',hash).single();if(error||!data){showErr('Credenciais inválidas.');return;}if(data.status==='pending'){showErr('Aguarde aprovação.');return;}if(data.status==='rejected'){showErr('Acesso negado.');return;}currentUser=data;localStorage.setItem('rbot_user',JSON.stringify(data));await addLog('login',data.name);enterApp();}
async function doRegister(){hideMsg();const name=document.getElementById('reg-name').value.trim(),email=document.getElementById('reg-email').value.trim(),cpf=document.getElementById('reg-cpf').value.trim(),pw=document.getElementById('reg-pass').value,pw2=document.getElementById('reg-pass2').value;if(!name||!email||!cpf||!pw){showErr('Preencha tudo.');return;}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showErr('Email inválido.');return;}if(!validateCPF(cpf)){showErr('CPF inválido.');return;}if(pw.length<6){showErr('Min 6.');return;}if(pw!==pw2){showErr('Senhas diferentes.');return;}const{count}=await sb.from('users').select('*',{count:'exact',head:true});const isFirst=count===0;const hash=await hashPw(pw);const{error}=await sb.from('users').insert({id:genId('u'),name,email,cpf:cleanCPF(cpf),password_hash:hash,role:isFirst?'superadmin':'operator',status:isFirst?'approved':'pending'});if(error){showErr(error.message.includes('duplicate')?'Já existe.':error.message);return;}await addLog('register',name);if(isFirst){const{data}=await sb.from('users').select('*').eq('email',email).single();currentUser=data;localStorage.setItem('rbot_user',JSON.stringify(data));enterApp();}else showInfo('Aguarde aprovação.');}
function doLogout(){addLog('logout','');currentUser=null;localStorage.removeItem('rbot_user');document.getElementById('appShell').classList.remove('active');document.getElementById('loginWrapper').style.display='';}
function enterApp(){document.getElementById('loginWrapper').style.display='none';document.getElementById('appShell').classList.add('active');document.getElementById('userName').textContent=currentUser.name;document.getElementById('userAvatar').textContent=currentUser.name.split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase();const b=document.getElementById('userRoleBadge');b.textContent=currentUser.role==='superadmin'?'Super':currentUser.role==='admin'?'Admin':'Op';b.className='user-role-badge '+currentUser.role;document.getElementById('navUsers').classList.toggle('hidden',!isSA());document.getElementById('navSettings').classList.toggle('hidden',!isSA());initGmail();nav('active');lucide.createIcons();}
async function checkSession(){const saved=localStorage.getItem('rbot_user');if(!saved)return;const u=JSON.parse(saved);const{data}=await sb.from('users').select('*').eq('id',u.id).eq('status','approved').single();if(data){currentUser=data;localStorage.setItem('rbot_user',JSON.stringify(data));enterApp();}else localStorage.removeItem('rbot_user');}

// === NAV ===
function nav(page,data){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+page).classList.add('active');document.querySelectorAll('.nav-item[data-page]').forEach(n=>n.classList.remove('active'));const nb=document.querySelector(`.nav-item[data-page="${page}"]`);if(nb)nb.classList.add('active');if(page==='active')renderActive();if(page==='resolved')renderResolved();if(page==='create')renderCreate();if(page==='detail'&&data)renderDetail(data);if(page==='rpa')renderRPA();if(page==='logs')renderLogs();if(page==='users')renderUsers();if(page==='settings')renderSettings();document.getElementById('sidebar').classList.remove('open');document.querySelector('.main-content').scrollTop=0;}

async function renderActive(){const{data:all}=await sb.from('incidents').select('*').order('created_at',{ascending:false});const a=(all||[]).filter(i=>i.status==='active');document.getElementById('page-active').innerHTML=`<div class="page-header"><div><h1 class="page-title">Ativos</h1></div><button class="btn btn-primary" onclick="nav('create')"><i data-lucide="plus" style="width:13px;height:13px"></i>Novo</button></div><div class="stats-row"><div class="stat-card"><div class="stat-label">Ativos</div><div class="stat-value danger">${a.length}</div></div><div class="stat-card"><div class="stat-label">Total</div><div class="stat-value accent">${(all||[]).length}</div></div></div>${a.length?`<div class="cards-grid">${a.map(i=>cCard(i,'active')).join('')}</div>`:'<div class="empty-state">Nenhum incidente ativo.</div>'}`;lucide.createIcons();}
async function renderResolved(){const{data:r}=await sb.from('incidents').select('*').eq('status','resolved').order('resolved_at',{ascending:false});document.getElementById('page-resolved').innerHTML=`<div class="page-header"><div><h1 class="page-title">Resolvidos</h1></div></div>${(r||[]).length?`<div class="cards-grid">${r.map(i=>cCard(i,'resolved')).join('')}</div>`:'<div class="empty-state">Nenhum.</div>'}`;lucide.createIcons();}
function cCard(i,from){const d=new Date(i.resolution_time).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});return `<div class="inc-card" onclick="lastDetailFrom='${from}';nav('detail','${i.id}')"><div class="inc-card-header"><span class="inc-card-title">${esc(i.title)}</span><span class="inc-card-badge ${i.status}">${i.status==='active'?'Ativo':'OK'}</span></div><div class="inc-card-meta">${i.protocol?`<span class="inc-card-protocol">${esc(i.protocol)}</span>`:''}<span>${esc(i.routine)}</span><span>${d}</span></div></div>`;}

div class="detail-field"><div class="detail-field-label">Criado</div><div class="detail-field-value">${cr}</div></div><div class="detail-field"><div class="detail-field-label">Por</div><div class="detail-field-value">${esc(i.created_by||'')}</div></div>${i.resolved_by?`<div class="detail-field" style="background:var(--success-subtle)"><div class="detail-field-label" style="color:var(--success)">Resolvido por</div><div class="detail-field-value">${esc(i.resolved_by)}</div></div>`:''}</div><div class="card"><p style="font-size:0.75rem;line-height:1.7;color:var(--text-secondary);white-space:pre-wrap">${esc(i.description)}</p></div>${i.image?`<div style="border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border);margin-bottom:16px"><img src="${i.image}" style="width:100%;display:block"></div>`:''}<div class="card"><div class="card-title">Emails</div><div class="email-tags">${el.map(e=>`<span class="email-tag">${esc(e)}</span>`).join('')}</div></div>${i.resolved_at?`<div class="card" style="background:var(--success-subtle)"><div style="font-size:0.5625rem;font-weight:700;color:var(--success)">RESOLVIDO EM</div><div style="font-size:0.8125rem;margin-top:2px">${new Date(i.resolved_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div>`:''}`;lucide.createIcons();}

function renderCreate(){document.getElementById('page-create').innerHTML=`<div class="page-header"><div><h1 class="page-title">Registrar Incidente</h1></div></div><div class="card"><div style="display:flex;flex-direction:column;gap:14px"><div class="grid-2"><div class="field"><label>Protocolo *</label><input type="text" id="f-protocol" placeholder="INC-0001"></div><div class="field"><label>Título *</label><input type="text" id="f-title"></div></div><div class="field"><label>Rotina *</label><input type="text" id="f-routine"></div><div class="field"><label>Descrição *</label><textarea id="f-description"></textarea></div><div class="field"><label>Evidência (imagem)</label><div class="image-upload-area" id="imgArea"><input type="file" id="f-image" accept="image/*" onchange="handleImg(event)"><div class="placeholder"><i data-lucide="image-plus"></i><span>Clique para selecionar</span></div></div></div><div class="divider"></div><div class="grid-2"><div class="field"><label>Previsão *</label><input type="datetime-local" id="f-resolution"></div><div class="field"><label>Responsável *</label><input type="text" id="f-responsible"></div></div><div class="divider"></div><div class="field"><label>Emails *</label><div class="email-row"><input type="email" id="f-email" placeholder="email@exemplo.com" onkeydown="if(event.key==='Enter'){event.preventDefault();addEmail();}"><button class="btn-icon-sm" onclick="addEmail()"><i data-lucide="plus" style="width:14px;height:14px"></i></button></div><div class="email-tags" id="fET"></div></div><div class="actions-row"><button class="btn btn-primary btn-lg" onclick="submitInc()"><i data-lucide="send" style="width:14px;height:14px"></i>Registrar e Enviar</button><button class="btn btn-ghost" onclick="nav('create')">Limpar</button></div></div></div>`;formEmails=[];formImage=null;lucide.createIcons();document.getElementById('imgArea').addEventListener('click',function(){if(!this.classList.contains('has-file'))document.getElementById('f-image').click();});}
function handleImg(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{formImage=ev.target.result;const area=document.getElementById('imgArea');area.classList.add('has-file');area.innerHTML=`<img src="${formImage}">`;};r.readAsDataURL(f);}
function addEmail(){const i=document.getElementById('f-email'),e=i.value.trim();if(!e||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e))return;if(!formEmails.includes(e))formEmails.push(e);i.value='';renderET();}
function renderET(){document.getElementById('fET').innerHTML=formEmails.map((x,i)=>`<span class="email-tag">${esc(x)}<button onclick="formEmails.splice(${i},1);renderET()">×</button></span>`).join('');}
async function submitInc(){const protocol=gv('f-protocol'),title=gv('f-title'),routine=gv('f-routine'),description=gv('f-description'),resolution_time=gv('f-resolution'),responsible=gv('f-responsible');if(!protocol||!title||!routine||!description||!resolution_time||!responsible||!formEmails.length){showToast('Preencha tudo.','error');return;}const id=genId('i');const incData={id,protocol,title,routine,description,resolution_time,responsible,image:formImage,created_by:currentUser.name,created_by_id:currentUser.id};const{error}=await sb.from('incidents').insert(incData);if(error){showToast('Erro: '+error.message,'error');return;}await sb.from('incident_emails').insert(formEmails.map(email=>({incident_id:id,email})));await addLog('create',`"${title}" [${protocol}]`);if(gmailToken){const to=formEmails.join(',');const sent=await sendGmailEmail(to,`⚠️ INCIDENTE [${protocol}]: ${title}`,buildIncidentEmailHtml(incData),formImage);showToast(sent?'Registrado e email enviado!':'Registrado! (email falhou)','success');}else showToast('Registrado!','success');nav('active');}
function gv(id){const el=document.getElementById(id);return el?el.value.trim():'';}

function saveRpaCfg(){
  localStorage.setItem('rbot_rpa_cfg',JSON.stringify({proxy:gv('rpa-proxy'),url:gv('rpa-url'),cid:gv('rpa-cid'),cs:gv('rpa-cs'),syn:gv('rpa-syn')}));
  showToast('Config salva!','success');
}

function getProxy(target){
  const proxy=gv('rpa-proxy');
  return proxy?proxy.replace(/\/$/,'')+'/'+target:target;
}

function rpaLog(type,msg){
  const con=document.getElementById('rpaConsole');
  if(!con)return;
  con.classList.remove('hidden');
  const time=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const cls=type==='req'?'req':type==='ok'?'res-ok':'res-err';
  con.innerHTML+=`<div class="${cls}">[${time}] ${msg}</div>`;
  con.scrollTop=con.scrollHeight;
}

async function rpaAuth(){
  const url=gv('rpa-url').replace(/\/$/,''),cid=gv('rpa-cid'),cs=gv('rpa-cs'),syn=gv('rpa-syn');
  if(!url||!cid||!cs||!syn){showToast('Preencha todos os campos.','error');return;}
  const st=document.getElementById('rpaSt');
  st.style.display='';st.className='rpa-status pending';st.textContent='Autenticando...';
  const endpoint=`${url}:45700/connect/token`;
  rpaLog('req',`POST ${endpoint}`);
  try{
    const body=`grant_type=${encodeURIComponent('client_credentials')}&scope=${encodeURIComponent('syngw ')}&client_id=${encodeURIComponent(cid)}&client_secret=${encodeURIComponent(cs)}&syndata=${encodeURIComponent(syn)}`;
    const r=await fetch(getProxy(endpoint),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
    const text=await r.text();
    if(!r.ok){rpaLog('err',`${r.status} ${text}`);throw new Error(`${r.status}: ${text}`);}
    const data=JSON.parse(text);
    rpaLog('ok',`200 OK | access_token: ${data.access_token?.substring(0,20)}... | expires_in: ${data.expires_in}`);
    if(!data.access_token)throw new Error('Token não retornado.');
    rpaToken=data.access_token;
    st.className='rpa-status ok';
    st.textContent=`Token OK! Expira em ${Math.floor((data.expires_in||3600)/60)}min`;
    document.getElementById('rS2').classList.remove('hidden');
    showToast('Autenticado!','success');
  }catch(e){
    st.className='rpa-status err';
    st.textContent=e.message;
    showToast('Erro: '+e.message,'error');
  }
}

function rpaExtractArray(payload){
  if(Array.isArray(payload)) return payload;
  if(!payload || typeof payload!=='object') return [];
  const preferredKeys=['data','items','content','clients','rows','records','results'];
  for(const key of preferredKeys){
    if(Array.isArray(payload[key])) return payload[key];
  }
  const nestedKeys=['response','result','payload','value'];
  for(const key of nestedKeys){
    const nested=rpaExtractArray(payload[key]);
    if(nested.length) return nested;
  }
  for(const value of Object.values(payload)){
    if(Array.isArray(value) && value.every(item=>item && typeof item==='object')) return value;
  }
  return [];
}

function rpaPick(obj,keys){
  for(const key of keys){
    if(obj && obj[key]!==undefined && obj[key]!==null && obj[key]!=='') return obj[key];
  }
  return '';
}

function rpaClientId(client){

function rpaClientName(client){

function rpaClientMeta(client){

  const city=[client?.city,client?.state].filter(Boolean).join('/');
  const email=rpaPick(client,['email','emailNfe']);
  return [doc,city,email].filter(Boolean).join(' • ');
}

async function rpaLoadClients(){
  const url=gv('rpa-url').replace(/\/$/,'');
  const page=Math.max(1, Number(document.getElementById('rpa-client-page').value || 1));
  const size=Math.max(1, Number(document.getElementById('rpa-client-size').value || 50));
  const endpoint=`${url}:45715/external/integrations/thirdparty/getclient?page=${page}&pageSize=${size}`;
  rpaLog('req',`GET ${endpoint}`);
  try{
    const r=await fetch(getProxy(endpoint),{headers:{'Authorization':`Bearer ${rpaToken}`,'Content-Type':'application/json'}});
    const text=await r.text();
    if(!r.ok){rpaLog('err',`${r.status} ${text}`);throw new Error(`${r.status}`);}
    const data=JSON.parse(text);
    rpaClients=rpaExtractArray(data);
    rpaLog('ok',`200 OK | ${rpaClients.length} clientes retornados`);
    if(!rpaClients.length){
      rpaLog('err',`Nenhum cliente localizado no payload | preview: ${JSON.stringify(data).slice(0,500)}`);
    }
    rpaSelectedClients=new Set();
    document.getElementById('rpaClientList').classList.remove('hidden');
    document.getElementById('rpaClientCount').textContent=`${rpaClients.length} cliente(s)`;
    rpaRenderClients();
    document.getElementById('rS3').classList.remove('hidden');
    showToast(rpaClients.length?`${rpaClients.length} clientes carregados.`:`Nenhum cliente encontrado na página ${page}.`,rpaClients.length?'success':'error');
  }catch(e){
    showToast('Erro: '+e.message,'error');
  }
}

function rpaRenderClients(filter=''){
  const list=document.getElementById('rpaClientItems');
  const query=(filter||'').toLowerCase().trim();
  const filtered=query?rpaClients.filter(client=>{
    const bag=[rpaClientId(client),rpaClientName(client),rpaClientMeta(client)].join(' ').toLowerCase();
    return bag.includes(query);
  }):rpaClients;

  list.innerHTML=filtered.length ? filtered.map(client=>{
    const id=rpaClientId(client);
    const sel=rpaSelectedClients.has(id);
    return `<div class="sol-item ${sel?'selected':''}" onclick="rpaToggleClient('${id}')">
      <input type="checkbox" ${sel?'checked':''} onclick="event.stopPropagation();rpaToggleClient('${id}')">
      <span class="sol-id">#${esc(id)}</span>
      <div class="sol-client">
        <span class="sol-name">${esc(rpaClientName(client))}</span>
        <span class="sol-meta">${esc(rpaClientMeta(client) || 'Sem detalhes adicionais')}</span>
      </div>
    </div>`;
  }).join('') : '<div class="empty-state" style="padding:18px 12px">Nenhum cliente encontrado para os filtros informados.</div>';

  document.getElementById('rpaClientCount').textContent=`${filtered.length} cliente(s)`;
  document.getElementById('rpaClientSelected').textContent=rpaSelectedClients.size;
  document.getElementById('rpaClientSelectAll').checked=filtered.length>0 && filtered.every(client=>rpaSelectedClients.has(rpaClientId(client)));
}

async function rpaLoadAssignmentsByClients(){
  const url=gv('rpa-url').replace(/\/$/,'');
  const selectedClientIds=[...rpaSelectedClients];
  if(!selectedClientIds.length){showToast('Selecione ao menos um cliente.','error');return;}
  const includeAll=document.getElementById('rpa-all-assignments').checked;
  const allAssignments=includeAll?'True':'False';
  const clientMap=new Map(rpaClients.map(client=>[rpaClientId(client),client]));
  const merged=[];
  const seen=new Set();
  document.getElementById('rpaLogS').classList.remove('hidden');

  for(const clientId of selectedClientIds){
    const endpoint=`${url}:45715/external/integrations/thirdparty/solicitationlist/${clientId}?allAssignments=${allAssignments}`;
    rpaLog('req',`GET ${endpoint}`);
    try{
      const r=await fetch(getProxy(endpoint),{headers:{'Authorization':`Bearer ${rpaToken}`,'Content-Type':'application/json'}});
      const text=await r.text();
      if(!r.ok){rpaLog('err',`${r.status} cliente ${clientId} | ${text}`);continue;}
      const data=JSON.parse(text);
      const items=rpaExtractArray(data);
      rpaLog('ok',`200 OK | cliente ${clientId} | ${items.length} solicitação(ões)`);
      const client=clientMap.get(String(clientId));
      for(const item of items){
        const assignmentId=rpaAssignmentId(item);
        if(!assignmentId || seen.has(assignmentId)) continue;
        merged.push({...item,__assignmentId:assignmentId,__clientId:String(clientId),__clientName:rpaClientName(client||{})});
        seen.add(assignmentId);
      }
    }catch(e){
      rpaLog('err',`cliente ${clientId} | ${e.message}`);
    }
  }

  rpaAssignmentsData=merged;
  rpaAssignments=merged.map(item=>String(item.__assignmentId || rpaAssignmentId(item))).filter(Boolean);
  rpaSelected=new Set(rpaAssignments);
  rpaTeams=[];
  rpaMotives=[];
  rpaStatuses=[];
  rpaForwardContext={assignmentId:'',loading:false,lastSelectionKey:''};
  rpaRender();
  rpaBar();
  document.getElementById('rS4').classList.remove('hidden');
  document.getElementById('rS5').classList.remove('hidden');
  document.getElementById('rS6').classList.remove('hidden');
  rpaResetForwardFields();
  if(rpaAssignments.length)await rpaSyncForwardParams();
  showToast(rpaAssignments.length?`${rpaAssignments.length} solicitações carregadas.`:'Nenhuma solicitação encontrada para os clientes selecionados.',rpaAssignments.length?'success':'error');
}

async function rpaGet(path,params={}){
  const url=gv('rpa-url').replace(/\/$/,'');
  const qs=Object.keys(params).length?'?'+new URLSearchParams(params):'';
  const endpoint=`${url}:45715${path}${qs}`;
  rpaLog('req',`GET ${endpoint}`);
  const r=await fetch(getProxy(endpoint),{headers:{'Authorization':`Bearer ${rpaToken}`,'Content-Type':'application/json'}});
  const text=await r.text();
  if(!r.ok){rpaLog('err',`${r.status} ${text}`);throw new Error(`${r.status}`);}
  const data=JSON.parse(text);
  const items=rpaExtractArray(data);
  const logicalMessage = (()=>{
    if(data && typeof data==='object' && !Array.isArray(data) && typeof data.message==='string' && !items.length)return data.message;
    if(Array.isArray(data) && data.length===1 && data[0] && typeof data[0]==='object' && typeof data[0].message==='string')return data[0].message;
    return '';
  })();
  if(logicalMessage){
    rpaLog('err',`200 ${logicalMessage}`);
    throw new Error(logicalMessage);
  }
  rpaLog('ok',`200 OK | ${items.length} item(ns)`);
  return items;
}

async function rpaPost(path,body){
  const url=gv('rpa-url').replace(/\/$/,'');
  const endpoint=`${url}:45715${path}`;
  rpaLog('req',`POST ${endpoint} | body: ${JSON.stringify(body)}`);
  const r=await fetch(getProxy(endpoint),{method:'POST',headers:{'Authorization':`Bearer ${rpaToken}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const text=await r.text();
  if(!r.ok){rpaLog('err',`${r.status} ${text}`);throw new Error(`${r.status}: ${text}`);}
  rpaLog('ok',`200 OK | ${text.substring(0,120)}`);
  return JSON.parse(text);
}

function rpaSetParamStatus(message,type='pending'){

function rpaSetFieldValidation(el,state){
  if(!el)return;
  el.classList.remove('invalid','valid');
  if(state==='invalid')el.classList.add('invalid');
  if(state==='valid')el.classList.add('valid');

function rpaResetForwardFields(message='Selecione ao menos uma solicitação para carregar os parâmetros.'){
  rpaTeams=[];

  rpaStatuses=[];
  ['rpa-team','rpa-motive','rpa-status','rpa-obs','rpa-resp'].forEach(id=>{

    if(!el)return;
    if(el.tagName==='SELECT')el.innerHTML='<option value="">Selecione...</option>';
    el.value='';
  });
  rpaSetForwardFieldsDisabled(true);
  rpaSetParamStatus(message,'pending');
  rpaSetHint('rpa-team-hint','Informe o Team ID ou deixe vazio para usar o Responsável ID.');

function rpaHandleRespInput(){
  const respField=document.getElementById('rpa-resp');
  if(!respField)return;
  respField.value=respField.value.replace(/\D/g,'');
  if(respField.disabled)return;
  rpaHandleTeamInput();
}

function rpaHandleTeamInput(){
  const teamField=document.getElementById('rpa-team');
  const respField=document.getElementById('rpa-resp');
  if(!teamField||!respField)return;
  teamField.value=teamField.value.replace(/\D/g,'');
  const teamValue=teamField.value.trim();
  const respValue=(respField.value||'').replace(/\D/g,'');
  respField.value=respValue;

  if(teamField.disabled){
    respField.disabled=true;
    rpaSetHint('rpa-team-hint','Selecione uma solicitação para habilitar os parâmetros.');
    rpaSetHint('rpa-resp-hint','Selecione uma solicitação para habilitar os parâmetros.');
    rpaSetFieldValidation(teamField,'neutral');
    rpaSetFieldValidation(respField,'neutral');
    return;
  }

  if(teamValue){
    respField.value='';
    respField.disabled=true;
    rpaSetFieldValidation(teamField,'valid');
    rpaSetFieldValidation(respField,'neutral');
    rpaSetHint('rpa-team-hint','Team ID informado. O encaminhamento usará este valor.','success');
    rpaSetHint('rpa-resp-hint','Responsável bloqueado porque a equipe foi informada.','warning');
    return;
  }

  respField.disabled=false;
  rpaSetHint('rpa-team-hint','Informe o Team ID ou deixe vazio para usar o Responsável ID.',respValue?'':'warning');
  if(respValue){
    rpaSetFieldValidation(teamField,'neutral');
    rpaSetFieldValidation(respField,'valid');
    rpaSetHint('rpa-resp-hint','Responsável ID será usado porque o Team ID está vazio.','success');
  }else{
    rpaSetFieldValidation(teamField,'invalid');
    rpaSetFieldValidation(respField,'neutral');
    rpaSetHint('rpa-resp-hint','Preencha o Responsável ID se não quiser informar Team ID.','warning');
  }
}

function rpaValidateRoutingFields(showToastOnError=false){
  const teamField=document.getElementById('rpa-team');
  const respField=document.getElementById('rpa-resp');
  if(!teamField||!respField)return false;
  const teamValue=teamField.value.trim();
  const respValue=respField.value.trim();

  if(teamValue){
    rpaSetFieldValidation(teamField,'valid');
    rpaSetFieldValidation(respField,'neutral');
    return true;
  }

  if(respValue){
    rpaSetFieldValidation(teamField,'neutral');
    rpaSetFieldValidation(respField,'valid');
    return true;
  }

  rpaSetFieldValidation(teamField,'invalid');
  rpaSetFieldValidation(respField,'neutral');
  rpaSetHint('rpa-team-hint','Informe o Team ID ou preencha o Responsável ID.','error');
  rpaSetHint('rpa-resp-hint','Preencha o Responsável ID se não quiser informar Team ID.','warning');
  if(showToastOnError)showToast('Informe o Team ID ou o Responsável ID.','error');
  return false;
}

function rpaSelectedAssignmentsData(){
  return rpaAssignmentsData.filter(item=>rpaSelected.has(String(item.__assignmentId || rpaAssignmentId(item))));
}

async function rpaSyncForwardParams(force=false){
  const selectedItems=rpaSelectedAssignmentsData();
  if(!selectedItems.length){
    rpaForwardContext.assignmentId='';
    rpaForwardContext.lastSelectionKey='';
    rpaResetForwardFields('Selecione ao menos uma solicitação para carregar os parâmetros.');
    return;
  }

  const firstWithAssignment=selectedItems.find(item=>String(item.__assignmentId || rpaAssignmentId(item)).trim());
  const assignmentId=firstWithAssignment?String(firstWithAssignment.__assignmentId || rpaAssignmentId(firstWithAssignment)).trim():'';

  if(!assignmentId){
    rpaForwardContext.assignmentId='';
    rpaForwardContext.lastSelectionKey='';
    rpaResetForwardFields('A solicitação selecionada não possui AssignmentID válido.');
    document.getElementById('rpaParamStatus').className='rpa-status err';
    return;
  }

  const selectionKey=selectedItems.map(item=>String(item.__assignmentId || rpaAssignmentId(item))).sort().join('|');
  if(!force && rpaForwardContext.assignmentId===assignmentId && rpaForwardContext.lastSelectionKey===selectionKey && rpaMotives.length && rpaStatuses.length){
    rpaSetForwardFieldsDisabled(false);
    rpaSetParamStatus(selectedItems.length>1?`Parâmetros carregados com base na solicitação #${assignmentId}. Informe o Team ID manualmente antes de encaminhar.`:`Parâmetros carregados para a solicitação #${assignmentId}. Informe o Team ID manualmente antes de encaminhar.`,'ok');
    return;
  }

  rpaForwardContext.assignmentId=assignmentId;
  rpaForwardContext.lastSelectionKey=selectionKey;
  rpaForwardContext.loading=true;
  rpaResetForwardFields(`Carregando parâmetros da solicitação #${assignmentId}...`);

  try{
    const [motives,statuses]=await Promise.all([
      rpaGet('/external/integrations/thirdparty/projects/solicitation/forward/motives'),
      rpaGet('/external/integrations/thirdparty/projects/solicitation/forward/incident-status')
    ]);

    const currentSelected=rpaSelectedAssignmentsData();
    const currentAssignment=currentSelected.find(item=>String(item.__assignmentId || rpaAssignmentId(item)).trim());
    const currentAssignmentId=currentAssignment?String(currentAssignment.__assignmentId || rpaAssignmentId(currentAssignment)).trim():'';
    if(currentAssignmentId!==assignmentId)return;

    rpaMotives=motives;
    rpaStatuses=statuses;

    rpaFillSelect('rpa-motive',rpaMotives);
    rpaFillSelect('rpa-status',rpaStatuses);
    rpaSetForwardFieldsDisabled(false);
    rpaSetParamStatus(currentSelected.length>1?`Parâmetros carregados com base na solicitação #${assignmentId}. Informe o Team ID manualmente antes de encaminhar.`:`Parâmetros carregados para a solicitação #${assignmentId}. Informe o Team ID manualmente antes de encaminhar.`,'ok');
  }catch(e){
    const message=e.message||'Não foi possível carregar os parâmetros de encaminhamento.';
    rpaResetForwardFields(message);
    document.getElementById('rpaParamStatus').className='rpa-status err';
  }finally{
    rpaForwardContext.loading=false;
  }
}

async function rpaExec(){
  document.getElementById('confirmModal').classList.remove('active');
  const teamRaw=document.getElementById('rpa-team').value.trim();
  const respRaw=gv('rpa-resp');
  const teamId=teamRaw?parseInt(teamRaw,10):0;
  const routingMotiveId=parseInt(document.getElementById('rpa-motive').value,10);
  const incidentStatusId=parseInt(document.getElementById('rpa-status').value,10);
  const responsibleId=respRaw?parseInt(respRaw,10):null;
  const motive=gv('rpa-obs');
  const ids=[...rpaSelected];

  if(!routingMotiveId||!incidentStatusId){showToast('Selecione motivo e status.','error');return;}
  if(!rpaValidateRoutingFields(true))return;

  document.getElementById('rpaLogS').classList.remove('hidden');
  const log=document.getElementById('rpaLog');
  let ok=0,er=0;
  for(let i=0;i<ids.length;i++){
    const assignmentId=parseInt(ids[i],10);
    const time=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    try{
      await rpaPost('/external/integrations/thirdparty/projects/solicitation/forward',{assignmentId,routingMotiveId,teamId,responsibleId,motive,incidentStatusId});
      ok++;
      log.innerHTML=`<div class="log-entry"><span style="font-size:0.5rem;color:var(--text-tertiary)">${time}</span><span class="log-entry-status ok">OK</span>#${assignmentId} encaminhado</div>`+log.innerHTML;
    }catch(e){
      er++;
      log.innerHTML=`<div class="log-entry"><span style="font-size:0.5rem;color:var(--text-tertiary)">${time}</span><span class="log-entry-status err">ERR</span>#${assignmentId}: ${e.message}</div>`+log.innerHTML;
    }
    if(i<ids.length-1)await new Promise(resolve=>setTimeout(resolve,350));
  }
  showToast(`Concluído: ${ok} ok, ${er} erro(s).`,er?'error':'success');
}


// === UTILS ===
function esc(s){if(!s)return '';const d=document.createElement('div');d.textContent=String(s);return d.innerHTML;}
function showToast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.className=`toast ${type} show`;setTimeout(()=>t.classList.remove('show'),4500);}

// === INIT ===
lucide.createIcons();
checkSession();
</script>
</body>
</html>
